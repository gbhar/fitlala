name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Expo SDK 57 needs Swift tools 6.2 (Xcode 26). Newer Xcodes (26.2/26.3)
      # reject expo-modules-jsi with "sending ... risks causing data races"
      # (expo/expo#47539), so pin the oldest Swift 6.2 toolchain and patch the
      # two remaining incompatibilities (weak let, SWIFT_RETURNS_RETAINED) below.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate iOS project (expo prebuild + pod install)
        run: npx expo prebuild --platform ios

      - name: Xcode info
        run: |
          xcodebuild -version; swift --version
          ls /Applications | grep -i xcode || true

      - name: Resolve Swift packages (raw output)
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ios/WakeFitAlarm.xcworkspace \
            -scheme WakeFitAlarm \
            -clonedSourcePackagesDirPath ios/SourcePackages

      - name: Patch expo-modules-jsi for Swift 6.2+ (expo/expo#50067)
        run: |
          # Swift 6.2.0 rejects SWIFT_RETURNS_RETAINED on constructors (expo/expo#50067).
          H=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler(/RuntimeScheduler(/' "$H"
          grep -n "RuntimeScheduler(" "$H" | head -4
          # `weak let` needs a newer Swift than 6.2.0. `nonisolated(unsafe) weak var`
          # is the pre-6.2 equivalent: mutable, exempt from Sendable checking —
          # sound here because these are set once in init (expo/expo#46242).
          grep -rl "weak let " node_modules/expo-modules-jsi/apple/Sources | while read -r f; do
            sed -i '' 's/weak let /nonisolated(unsafe) weak var /g' "$f"
          done
          grep -rc "weak let " node_modules/expo-modules-jsi/apple/Sources || echo "all weak lets patched"

      - name: Prebuild ExpoModulesJSI xcframework (isolated, full output)
        run: |
          PODS_ROOT="$PWD/ios/Pods" RN_ROOT="$PWD/node_modules/react-native" PLATFORM_NAME=iphoneos \
            bash node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/WakeFitAlarm.xcworkspace \
            -scheme WakeFitAlarm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath ios/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error|warning: Could not|BUILD" | head -100 || true
          tail -5 xcodebuild.log
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WakeFitAlarm.app"
          test -d "$APP_PATH" || { echo "::error::.app not found"; exit 1; }
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WakeFitAlarm-unsigned.ipa Payload
          ls -la WakeFitAlarm-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WakeFitAlarm-unsigned-ipa
          path: WakeFitAlarm-unsigned.ipa
          retention-days: 30
