name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Expo SDK 57 needs Swift tools 6.2 (Xcode 26). expo-modules-jsi 57.x
      # does not compile from source on ANY current Swift 6.2 compiler
      # (expo/expo#46242, #50067, #47539) — the supported path is precompiled
      # xcframeworks (what EAS uses), enabled below.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app
      # Download prebuilt Expo/RN xcframeworks instead of compiling from source.
      EXPO_USE_PRECOMPILED_MODULES: '1'
      EXPO_PRECOMPILED_FLAVOR: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate iOS project (expo prebuild + pod install)
        run: npx expo prebuild --platform ios

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/WakeFitAlarm.xcworkspace \
            -scheme WakeFitAlarm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath ios/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error|BUILD" | head -100 || true
          tail -5 xcodebuild.log
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WakeFitAlarm.app"
          test -d "$APP_PATH" || { echo "::error::.app not found"; exit 1; }
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WakeFitAlarm-unsigned.ipa Payload
          ls -la WakeFitAlarm-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WakeFitAlarm-unsigned-ipa
          path: WakeFitAlarm-unsigned.ipa
          retention-days: 30
